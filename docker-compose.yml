services:
  teams-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${DASHBOARD_API_URL:-http://localhost:8080}

    container_name: teams-integration-dashboard

    ports:
      - "3000:80"

    depends_on:
      - teams-api

    restart: unless-stopped

    networks:
      - teams-network

  teams-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: teams-integration-api

    ports:
      - "8080:8080"

    depends_on:
      postgresql:
        condition: service_healthy

      minio:
        condition: service_healthy
    
    restart: unless-stopped

    volumes:
      - teams-data-protection:/root/.aspnet/DataProtection-Keys

    environment:
      ASPNETCORE_ENVIRONMENT: Docker

      MicrosoftGraph__TenantId: ${GRAPH_TENANT_ID}
      MicrosoftGraph__ClientId: ${GRAPH_CLIENT_ID}
      MicrosoftGraph__ClientSecret: ${GRAPH_CLIENT_SECRET}
      
      Minio__Endpoint: minio:9000
      Minio__AccessKey: teams-admin
      Minio__SecretKey: teams-password
      Minio__BucketName: teams-integration
      Minio__UseSsl: "false"
      Minio__PresignedUrlExpirationDay: "7"

      AccessHub__BaseUrl: ${ACCESSHUB_BASE_URL}
      AccessHub__ApplicationId: ${ACCESSHUB_APPLICATION_ID}
      AccessHub__ClientId: ${ACCESSHUB_CLIENT_ID}
      AccessHub__Username: ${ACCESSHUB_USERNAME}
      AccessHub__Password: ${ACCESSHUB_PASSWORD}

      AccessHub__Jwt__SecretKey: ${ACCESSHUB_JWT_SECRET_KEY}
      AccessHub__Jwt__Algorithm: HS256
      AccessHub__Jwt__PermissionClaimType: permission
      AccessHub__Jwt__ValidateIssuer: true
      AccessHub__Jwt__Issuer: ${ACCESSHUB_JWT_ISSUER}
      AccessHub__Jwt__ValidateAudience: true
      AccessHub__Jwt__Audience: ${ACCESSHUB_JWT_AUDIENCE}
      AccessHub__Jwt__ClockSkewSeconds: "30"

      HttpsRedirection__Enabled: "false"

      Cors__AllowedOrigins__0: ${DASHBOARD_ORIGIN:-http://localhost:3000}

      ConnectionStrings__PostgreSQL: "Host=postgresql;Port=5432;Database=teams_integration;Username=postgres;Password=admin" 
      
      MicrosoftTeams__WebhookUrl: ${WEBHOOK_URL}
      
    networks:
      - teams-network

  postgresql:
    image: postgres:18

    container_name: teams-postgresql

    restart: unless-stopped

    environment:
      POSTGRES_DB: teams_integration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin

    volumes:
      - teams-postgres-data:/var/lib/postgresql

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teams_integration"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - teams-network

  minio:
    image: minio/minio:latest

    container_name: teams-minio
    
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: teams-admin
      MINIO_ROOT_PASSWORD: teams-password

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - teams-minio-data:/data

    healthcheck:
      test: [
        "CMD", 
        "curl",
        "-f",
        "http://localhost:9000/minio/health/live"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - teams-network

volumes:
  teams-postgres-data:
  teams-minio-data:
  teams-data-protection:

networks:
  teams-network:
