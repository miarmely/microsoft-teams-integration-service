# for dynamic calling
x-logging: &default-logging
  driver: "json-file"

  options:
    max-size: "10m"
    max-file: "3"

services:
  teams-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${DASHBOARD_API_URL:-http://localhost:8080}

    container_name: teams-integration-dashboard

    ports:
      - "3000:80"

    depends_on:
      - teams-api

    restart: unless-stopped

    networks:
      - teams-network

    logging: *default-logging

  teams-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: teams-integration-api

    ports:
      - "8080:8080"

    depends_on:
      postgresql:
        condition: service_healthy

      minio:
        condition: service_healthy

    restart: unless-stopped

    volumes:
      - teams-data-protection:/root/.aspnet/DataProtection-Keys

    environment:
      ASPNETCORE_ENVIRONMENT: Docker

      MicrosoftGraph__TenantId: ${GRAPH_TENANT_ID:?Set GRAPH_TENANT_ID in .env}
      MicrosoftGraph__ClientId: ${GRAPH_CLIENT_ID:?Set GRAPH_CLIENT_ID in .env}
      MicrosoftGraph__ClientSecret: ${GRAPH_CLIENT_SECRET:?Set GRAPH_CLIENT_SECRET in .env}
      MicrosoftGraph__RedirectUri: ${GRAPH_REDIRECT_URI:-http://localhost:8080/api/microsoft-graph/oauth/callback}
      MicrosoftGraph__PostLoginRedirectUri: ${DASHBOARD_ORIGIN:-http://localhost:3000}
      MicrosoftGraph__TokenCachePath: /root/.aspnet/DataProtection-Keys/microsoft-graph-token-cache.bin

      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      Minio__BucketName: ${MINIO_BUCKET_NAME:-teams-integration}
      Minio__UseSsl: "false"
      Minio__PresignedUrlExpirationDay: "7"

      AccessHub__BaseUrl: ${ACCESSHUB_BASE_URL:?Set ACCESSHUB_BASE_URL in .env}
      AccessHub__ApplicationId: ${ACCESSHUB_APPLICATION_ID:?Set ACCESSHUB_APPLICATION_ID in .env}
      AccessHub__ClientId: ${ACCESSHUB_CLIENT_ID:?Set ACCESSHUB_CLIENT_ID in .env}
      AccessHub__Username: ${ACCESSHUB_USERNAME:?Set ACCESSHUB_USERNAME in .env}
      AccessHub__Password: ${ACCESSHUB_PASSWORD:?Set ACCESSHUB_PASSWORD in .env}

      AccessHub__Jwt__SecretKey: ${ACCESSHUB_JWT_SECRET_KEY:?Set ACCESSHUB_JWT_SECRET_KEY in .env}
      AccessHub__Jwt__Algorithm: HS256
      AccessHub__Jwt__PermissionClaimType: permission
      AccessHub__Jwt__ValidateIssuer: true
      AccessHub__Jwt__Issuer: ${ACCESSHUB_JWT_ISSUER:?Set ACCESSHUB_JWT_ISSUER in .env}
      AccessHub__Jwt__ValidateAudience: true
      AccessHub__Jwt__Audience: ${ACCESSHUB_JWT_AUDIENCE:?Set ACCESSHUB_JWT_AUDIENCE in .env}
      AccessHub__Jwt__ClockSkewSeconds: "30"

      HttpsRedirection__Enabled: "false"

      Cors__AllowedOrigins__0: ${DASHBOARD_ORIGIN:-http://localhost:3000}

      ConnectionStrings__PostgreSQL: "Host=postgresql;Port=5432;Database=${POSTGRES_DB:-teams_integration};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"

    networks:
      - teams-network

    logging: *default-logging

  postgresql:
    image: postgres:18

    container_name: teams-postgresql

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teams_integration}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - teams-postgres-data:/var/lib/postgresql

    ports:
      - "5432:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - teams-network

    logging: *default-logging

  minio:
    image: minio/minio:latest

    container_name: teams-minio

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - teams-minio-data:/data

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - teams-network

    logging: *default-logging

volumes:
  teams-postgres-data:
  teams-minio-data:
  teams-data-protection:

networks:
  teams-network:
