services:
  postgresql:
    image: postgres:18
    container_name: teams-postgresql
    restart: unless-stopped

    environment:
      POSTGRES_DB: teams_integration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - teams-postgres-data:/var/lib/postgresql

    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U postgres -d teams_integration"
      ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  teams-postgres-data: