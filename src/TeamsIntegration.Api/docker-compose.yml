services:
  postgresql:
    image: postgres:18
    container_name: teams-postgresql
    restart: unless-stopped

    environment:
      POSTGRES_DB: teams_integration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - teams-postgres-data:/var/lib/postgresql

    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U postgres -d teams_integration"
      ]
      interval: 5s
      timeout: 5s
      retries: 10

  teams-mino:
    image: minio/minio:latest
    container_name: teams-minio
    restart: unless-stopped
    
    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: teams-admin
      MINIO_ROOT_PASSWORD: teams-password

    command: server /data --console-address ":9001"

    volumes:
      - teams-minio-data:/data

volumes:
  teams-postgres-data:
  teams-minio-data: